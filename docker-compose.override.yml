services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: make dev 
    ports:
      - "8080:8080"
    volumes:
      - "./app:/app"
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  caddy:
    image: caddy:2.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}     
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data: