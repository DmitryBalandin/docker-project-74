name: ci

on:
  push:
    branches: [ main ]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file for CI
        run: |
          cp app/.env.example .env
          # В CI база данных доступна по имени сервиса "db", а не localhost
          sed -i 's/DATABASE_HOST=localhost/DATABASE_HOST=db/' .env  
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
     
      - name: Run tests via Docker Compose
        run: make ci

      - name: Build production image
        run: docker compose -f docker-compose.yml build app

      - name: Push image to Docker Hub
        run: docker compose -f docker-compose.yml push app